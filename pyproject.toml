[project]
name = "dbtidy"
version = "0.2.0"
description = "Linter et convertisseur de projets dbt sur Oracle, attentif aux couches."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antoaneta Stoyanova" }]
keywords = ["dbt", "oracle", "linter", "sql", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "beartype>=0.22.9",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "sqlglot>=30.21.0",
]

[project.urls]
Homepage = "https://github.com/AntoanetaStoyanova/dbtidy"
Documentation = "https://antoanetastoyanova.github.io/dbtidy/"
Changelog = "https://github.com/AntoanetaStoyanova/dbtidy/blob/main/CHANGELOG.md"
Issues = "https://github.com/AntoanetaStoyanova/dbtidy/issues"

[project.scripts]
dbtidy = "dbtidy.__main__:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
fix = true
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",
    "--cov=src/dbtidy",
    "--cov-report=term-missing",
    "--cov-report=html",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 88
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
skip_empty = true

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true
exclude = ["tasks/", "docs/"]

[dependency-groups]
dev = [
    "invoke>=2.2.0",
    "mypy>=1.20.0",
    "ruff>=0.14.9",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "sphinx>=7.0.0",
    "furo>=2024.1.0",
    "pre-commit>=4.6.2",
    "types-pyyaml>=6.0.12.20260906",
]
